#
# SBCEye Default Settings
#  Copy this file ('defaults.ini')  to 'settings.ini' and edit
#


# General Settings
#  name:            Used in logs and web, blank = hostname
#  long_format:     Long time format for web, etc. time.strftime()
#  short_format:    Short time format for logs, etc. time.strftime()
#  log_daily:       Log a 'heartbeat'every day? True/False`
#  sensor:          Look for BME280 sensor? True/False
#  display:          Look for OLED display? True/False
#  pin_state_names: Localisation text for pin status (text,text)
#
[general]
name = My Awesome SBC
long_format = %H:%M:%S, %A, %d %B, %Y
short_format = %d-%m-%Y %H:%M:%S
log_daily = True
display = False
sensor = False
pin_state_names = Off,On

#
# Internal Webserver

#  host: Ip address to bind server to, blank = bind to all addresses
#  port: Port number for web server
#  sensor_name: Sensor name used in web panel (eg; location)
#  pin_info: Show pin direction/consumer alongside pin state
#  allow_dump: Allows RRDB database dumps via we:, be careful using this
#    since it can impact performance while running
#  allow_backup: Allows RRDB database backup triggering via web, be careful using this
#    since it can impact performance while running
#
[web]
host = 
port = 7080
sensor_name = Room
pin_info = True
allow_dump = True
allow_backup = True

# Time intervals (seconds) for the main system action schedules
#  data: Interval between main reading updates
#  pin:  Pins are checked for state changes this frequently
#  rrd:  Maximum age before cached RRD database updates are written
#  ping: Timout for ping responses
#        - must be > 4 to distinguish 'unavailable' vs 'not responding' in logs
#        - will be reduced if it exceeds the data interval (above) -0.5s
[intervals]
data = 10
pin = 1
rrd = 300
ping = 4

# RRD graphing options
#  durations: Default graph durations
#  wide: Total width in pixels
#  high: Total height in pixels, pin graphs are 1/2 this height
#  line_color: hex format, tip: https://www.w3schools.com/colors/colors_picker.asp
#  line_width: pixels
#  area_color: start and end color for shading below line, set blank to disable
#  area_depth: gradient depth in pixels, 0 = extend to bottom of graph
#  half_height: Graphs matching this prefix will be drawn half-height
#
# default durations are mapped in rrd graph as: start='end-<duration>', 'end=now'
# for more details on how to specify the range see the rrd documentation.
# https://oss.oetiker.ch/rrdtool/doc/rrdfetch.en.html#TIME%20OFFSET%20SPECIFICATION
# Note: 'm' means Minutes for large values, but Months for values from 1 to 5.
#
[graph]
durations = 600s,1h,3h,1d,3d,1w,1m,3m,1y,3y
wide = 1200
high = 300
line_color = #00A0A0
line_width = 2
area_color = #D0E0E0#FFFFFF
area_depth = 0
half_height = pin,net

# List of fixed links for the main page's footer (optional)
#  Give one link per line:
#     link_name = URL
#  Underscores in the name will be converted to spaces when displayed
# eg:
# [links]
# Homepage = https://www.example.org/
# Webcam_Viewer = https://www.example.org/webcam/?action=stream
# Cool stuff = http://some.thing.cool/
#
[links]

# GPIO pins to monitor and log
# pins are specified with their gpio chip device and index.
#  - in general the gpiochip0 pin index numbers correspond to
#     the BCM pin numbering scheme used in older Pi libraries.
#  - for other architectures you need to reference the hardware
#     documentation for your Board.
#  - see https://raspberrypi.stackexchange.com/a/147309
#  - an empty list disables pin monitoring
#  Pins are listed one per line:
#      <Pin Name> = gpiochip device path, pin number
# eg:
# [pins]
# Lamp = /dev/gpiochip0, 7
# Ventilator = /dev/gpiochip0, 8
# Printer = /dev/gpiochip0, 25
#
[pins]

# Pins to control, and their default value
#  - pins listed here must be defined in [pins] list above
#  - if the pin is already an output it's value will not be changed
#  - if the pin is an input it will be set to an output and the initial
#     value of the pin set to the value listed
#  - however, if the pin is in use (consumed) by another process
#     it cannot be controlled and no control options will be shown
# eg:
# [outpins]
# Lamp = 0
# Ventilator = 1
#
[outpins]

# An optional list of targets to be used for network connectivity (ping) tests
#  Targets are listed one per line:
#      <Target Name> = ip address
# eg:
# [ping]
# router = 192.168.0.1
# internet = 8.8.8.8
#
[ping]

# Action Logging
#  file_dir:    Folder must be writable by the SBCEye process
#  file_name:   <name>.log
#  file_count:  Maximum number of old logfiles to retain
#  file_size:   Maximum size before logfile rolls over (Kb)
[log]
file_dir = ./data
file_name = SBCEye.log
file_count = 3
file_size = 1024

# RRD database
#  dir:          Folder must be writable by SBCEye process
#  file_name:    Database file name; <name>.rrd
#  cache_age:    Cache will be written to the database on this interval
#  backup_count: Maximum number of backups to retain, 0 to disable backups
#  backup_age:   Backups will not be deleted if under this age, even
#                 if that breaks the backup_count limit. (Days)
#  backup_time:  Time of daily backup; HH:MM
[rrd]
dir = ./data
file_name = SBCEye.rrd
backup_count = 10
backup_age = 7
backup_time = 23:45

# I2C Bus options
# only used if display or sensor enabled in [general] config
#  bus_id:   The I2C bus to use, integer
#  sensor_addr: I2C address of the sensor
#  display_addr: I2C address of the display
[bus]
bus_id = 1
sensor_addr = 0x76
display_addr = 0x3c

# The following display, saver and animate options are only used
#  if display is enabled in [general] config

# OLED Status dsplay options
#  rotate:   Is the display 'upside down'?
#            - generally the connections from the glass are at the bottom
#  contrast: This gives a limited brightness reduction (0-255)
#            - does not give full dimming to black
[display]
rotate= False
contrast = 127

# Screen saver / burn-in reducer
#   saver_mode: Possible values are 'none' or 'blank'
#   saver_on:   Start time for screensaver (hour, 24hr clock)
#   saver_off:  End time
[saver]
mode = none
on  = 20
off =  8

# Display Animation
#  passtime: time between display refreshes (seconds)
#  passes:   number of refreshes of a screen before moving to next
#  speed:    rows to scroll on each animation step between screens
[animate]
passtime = 3
passes = 2
speed = 16

# Enable extra debug
#  http:  Log http requests to console (or syslog when run as a service)
#  sigint: restart on SIGINT instead of exiting
[debug]
http = False
sigint = False
